<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>:hover 활용</title>
<style>
  div.card {
    width: 100px;
    height: 140px;
    background-image: url('media/card_back.png'); /* 카드 뒷면 이미지 경로 */
    background-size: cover;
  }
  div.card:hover {
    background-image: url('media/card_front.png'); /* 카드 앞면 이미지 경로 */
  }
</style>
</head>
<body>
<h3>:hover 활용</h3>
<p>마우스를 올리면 카드의 앞면이 보인다.</p>
<hr>
<div class="card"></div>
</body>
</html>
