<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>소프트웨어 기술 선호에 관한 설문</title>
<link rel="stylesheet" type="text/css" href="survey4.css">
</head>
<body>
<h2>설문지</h2>
<p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
<hr>

<form>
  <div class="form-group">
    <label>학년</label>
    <input type="radio" name="grade" value="1">1학년
    <input type="radio" name="grade" value="2">2학년
    <input type="radio" name="grade" value="3">3학년
    <input type="radio" name="grade" value="4">4학년
  </div>

  <div class="form-group">
    <label>성별</label>
    <input type="radio" name="gender" value="m">남
    <input type="radio" name="gender" value="f">여
  </div>

  <div class="form-group">
    <label>관심 분야</label>
    <select name="field">
      <option value="mobile">모바일 소프트웨어</option>
      <option value="web">웹 소프트웨어</option>
      <option value="ai">인공지능</option>
    </select>
  </div>

  <div class="form-group">
    <label>진로(다중 선택)</label>
    <input type="checkbox" name="career" value="dev">개발
    <input type="checkbox" name="career" value="plan">기획
    <input type="checkbox" name="career" value="sales">영업
    <input type="checkbox" name="career" value="startup">창업
  </div>

  <div class="form-group">
    <label>남기고 싶은 말</label><br>
    <textarea rows="5" cols="40" placeholder="글을 남겨주세요"></textarea>
  </div>
</form>

<footer>
  Copyright 2022 by Kitae
</footer>
</body>
</html>
