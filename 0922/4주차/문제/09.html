<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>text-shadow와 box-shadow</title>
<style>
  h3 {
    color: brown;
    text-shadow: 2px 2px 5px yellow;
  }
  .site-img {
    width: 120px;
    margin: 5px;
    border: 1px solid gray;
  }
  .site-img:hover {
    box-shadow: 5px 5px 10px gray;
  }
</style>
</head>
<body>
<h3>Most Visited Pages</h3>
<hr>
<div>
  <img src="media/naver.png" class="site-img" alt="네이버">
  <img src="media/chosun.png" class="site-img" alt="조선일보">
  <img src="media/amazon.png" class="site-img" alt="아마존">
</div>
</body>
</html>
