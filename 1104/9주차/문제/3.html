<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>계산기 만들기</title>
<script>
function calculate(e) {
    if (e.key === "Enter") {
        let exp = document.getElementById("exp").value;
        let result = document.getElementById("result");

        try {
            if (!/^[0-9+\-*/().\s]+$/.test(exp)) {
                throw new Error("잘못된 수식");
            }
            result.value = eval(exp);
        } catch (error) {
            result.value = "계산 오류";
        }
    }
}
</script>
</head>
<body>
<h3>계산기 만들기</h3>
<hr>
<p>수식을 입력하고 Enter를 입력하세요.</p>

식 <input type="text" id="exp" onkeydown="calculate(event)">
<br>
값 <input type="text" id="result" readonly>

</body>
</html>
