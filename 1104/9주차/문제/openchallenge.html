<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>마우스 클릭 연습</title>
<style>
table {
    border-collapse: collapse;
}

td {
    border: 1px solid blue;
    width: 40px;
    height: 40px;
    text-align: center;
}

img {
    width: 35px;
    height: 35px;
    cursor: pointer;
}
</style>
</head>
<body>
<h3>마우스 클릭 연습</h3>
<hr>

<table id="board"></table>

<script>
let board = document.getElementById("board");
let cells = [];

for (let i = 0; i < 10; i++) {
    let tr = document.createElement("tr");

    for (let j = 0; j < 10; j++) {
        let td = document.createElement("td");
        tr.appendChild(td);
        cells.push(td);
    }

    board.appendChild(tr);
}

let img = document.createElement("img");
img.src = "donkey.png";
img.alt = "당나귀";

let current = -1;

function moveImage() {
    let next;

    do {
        next = Math.floor(Math.random() * 100);
    } while (next === current);

    cells[next].appendChild(img);
    current = next;
}

img.onclick = moveImage;

moveImage();
</script>
</body>
</html>
