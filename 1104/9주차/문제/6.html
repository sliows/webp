<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이미지 확대</title>
<script>
function zoomIn(obj) {
    obj.style.width = "500px";
    obj.style.height = "350px";
}

function zoomOut(obj) {
    obj.style.width = "100px";
    obj.style.height = "70px";
}
</script>
</head>
<body>
<h3>마우스를 올리면 이미지 확대</h3>
<hr>
<p>이미지 위에 마우스를 올리면 확대되고
벗어나면 원래 크기로 돌아옵니다.</p>

<img src="tulip.jpg" width="100" height="70"
     onmouseover="zoomIn(this)"
     onmouseout="zoomOut(this)">
</body>
</html>
