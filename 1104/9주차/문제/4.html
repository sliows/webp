<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이미지 커서 만들기</title>
<style>
body {
    cursor: none;
}

#cursor {
    position: absolute;
    width: 30px;
    height: 30px;
    pointer-events: none;
}

#cursor img {
    width: 30px;
    height: 30px;
}
</style>
<script>
document.onmousemove = function(e) {
    let cursor = document.getElementById("cursor");
    cursor.style.left = (e.pageX + 5) + "px";
    cursor.style.top = (e.pageY + 5) + "px";
};
</script>
</head>
<body>
<h3>이미지 커서 만들기</h3>
<hr>
<p>마우스를 움직이면 이미지로 만든 커서가
마우스를 따라다닙니다.</p>

<div id="cursor">
    <img src="cursor.png">
</div>

</body>
</html>
