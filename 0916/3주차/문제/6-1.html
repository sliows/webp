<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>소프트웨어 기술 선호에 관한 설문</title>
</head>
<body>
    <h2>설문지</h2>
    <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    <hr>
    
    <form>
        <!-- 학년 선택 (라디오 버튼) -->
        <p>
            <b>학년</b> 
            <input type="radio" name="grade" value="1" checked>1학년 
            <input type="radio" name="grade" value="2">2학년 
            <input type="radio" name="grade" value="3">3학년 
            <input type="radio" name="grade" value="4">4학년
        </p>

        <!-- 성별 선택 (라디오 버튼) -->
        <p>
            <b>성별</b> 
            <input type="radio" name="gender" value="m">남 
            <input type="radio" name="gender" value="f">여
        </p>

        <!-- 관심 분야 (드롭다운 메뉴) -->
        <p>
            <b>관심 분야</b> 
            <select name="interest">
                <option value="mobile" selected>모바일 소프트웨어</option>
                <option value="web">웹 프로그래밍</option>
                <option value="bigdata">빅데이터</option>
                <option value="ai">인공지능</option>
            </select>
        </p>

        <!-- 진로 선택 (체크박스 - 다중 선택) -->
        <p>
            <b>진로</b> 
            <input type="checkbox" name="job" value="dev" checked>개발 
            <input type="checkbox" name="job" value="plan">기획 
            <input type="checkbox" name="job" value="sales">영업 
            <input type="checkbox" name="job" value="startup">창업
        </p>

        <!-- 남기고 싶은 말 (텍스트 상자) -->
        <p>
            <b>남기고 싶은 말</b><br>
            <textarea rows="5" cols="40" placeholder="글을 남겨주세요"></textarea>
        </p>
    </form>

    <br>
    <footer>
        Copyright 2022 by Kitae
    </footer>
</body>
</html>
