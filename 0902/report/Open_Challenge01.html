<!DOCTYPE html>
<html>
<title>나의 소개</title>
<head><meta charset="UTF-8">
<style>
    body {
        background-color: linen; color: green;
        margin-left: 40px;
        margin-right: 40px;
    }
    h3 {
        text-align: center;
        color: darkred;
    }
    hr {
        height: 5px;
        border: solid grey;
        background-color: grey;
    }
    span {
        color: blue;
        font-size: 20px;
    }
 
</style>

<script>
    function show() {
        document.getElementById("sliows").src = "sliows.jpg";
    }
    function hide() {
        document.getElementById("sliows").src = "";
    }
</script>
</head>
<body>
    <h3 onmouseover="show()" onmouseout="hide()"> 김석현 </h3>
    <hr>
    <div>
        <img id="sliows" src="">
    </div>
    저는 대한민국에서 태어나서 컴퓨터 공학을 전공하는 학생입니다. 제가 제일 좋아하는 과목은 <span>웹 프로그래밍</span>이고, 그 중에 서도 <span>자바스립트</span>를 제일 잘합니다.
</body>
</html>
