<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let inputStr = prompt("숫자 입력", "");
    let n = parseInt(inputStr);
    
    let temp = n;
    let least = temp % 10; // 가장 낮은 자리 수
    let most = 0;          // 가장 큰 자리 수

    while (temp >= 10) {
        temp = Math.floor(temp / 10);
    }
    most = temp;

    document.write(n + ": ");
    if (most === least) {
        document.write("성공");
    } else {
        document.write("다름");
    }
</script>
</body>
</html>
