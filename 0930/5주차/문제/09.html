<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>카푸치노 만들기</title>
<style>
ol {
    list-style-type: none;
    padding-left: 0;
}
ol li {
    margin-bottom: 10px;
}
.num {
    font-size: 2em;
    font-weight: bold;
    color: green;
    margin-right: 10px;
}
p {
    display: inline-block;
    vertical-align: top;
    margin: 0;
}
</style>
</head>
<body>
<h3>카푸치노 만드는 순서</h3>
<hr>
<ol>
    <li>
        <span class="num">1.</span>
        <p>에스프레소를 추출한다. 반드시<br>에스프레소 콩을 사용해야 제맛<br>이 난다.</p>
    </li>
    <li>
        <span class="num">2.</span>
        <p>적당한 용기에 우유를 넣어 중탕<br>을 하거나 끓기 직전까지 데운다.</p>
    </li>
    <li>
        <span class="num">3.</span>
        <p>몇초간 저어 충분히 거품을 낸다.<br>거품이 충분하지 않으면 풍미가<br>떨어진다.</p>
    </li>
    <li>
        <span class="num">4.</span>
        <p>컵에 계피 막대를 꽂고 커피를 부<br>은후 우유 거품을 붓는다. 휘핑크<br>림을 얹고 계피가루를 뿌린다.</p>
    </li>
</ol>
</body>
</html>
